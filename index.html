<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Value Rate Calculator</title>
<link rel="stylesheet" href="https://unpkg.com/mdui@2/mdui.css">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
<script src="https://unpkg.com/mdui@2/mdui.global.js"></script>
<style>
  /* ============================================================
     Pixel MD：mdui 2 全量设计令牌定制
     Pixel 系特征 = 全组件圆丸化 + 大留白 + 动态配色
     ============================================================ */
  :root {
    /* 圆角令牌：全部拉满（Pixel MD 的核心特征） */
    --mdui-shape-corner-none: 0;
    --mdui-shape-corner-extra-small: 1rem;
    --mdui-shape-corner-small: 1.5rem;
    --mdui-shape-corner-medium: 2rem;
    --mdui-shape-corner-large: 2.25rem;
    --mdui-shape-corner-extra-large: 3rem;
    --mdui-shape-corner-full: 1000rem;

    /* 状态层 */
    --mdui-state-layer-hover: 0.08;
    --mdui-state-layer-focus: 0.1;
    --mdui-state-layer-pressed: 0.14;
    --mdui-state-layer-dragged: 0.16;

    /* M3 emphasized 动效 */
    --mdui-motion-easing-standard: cubic-bezier(0.2, 0, 0, 1);
    --mdui-motion-easing-emphasized: cubic-bezier(0.05, 0.7, 0.1, 1);
    --mdui-motion-duration-medium4: 400ms;
  }

  body {
    margin: 0;
    padding: 0;
    min-height: 100vh;
    background-color: rgb(var(--mdui-color-surface-dim));
    color: rgb(var(--mdui-color-on-surface));
    font-family: "Roboto", "Noto Sans SC", "Microsoft YaHei", sans-serif;
    font-size: 0.9375rem;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    transition: background-color 0.3s var(--mdui-motion-easing-standard);
  }

  .container {
    max-width: 720px;
    margin: 0 auto;
    padding: 24px 16px 56px;
  }

  /* ---------- 顶部 Hero：M3 大标题 + 全丸角 ---------- */
  .hero {
    display: flex;
    align-items: center;
    gap: 18px;
    padding: 28px 32px;
    margin-bottom: 24px;
    background: linear-gradient(135deg,
      rgb(var(--mdui-color-primary-container)),
      rgb(var(--mdui-color-secondary-container)));
    color: rgb(var(--mdui-color-on-primary-container));
    border-radius: var(--mdui-shape-corner-extra-large);
    box-shadow: var(--mdui-elevation-level2);
  }
  .hero .logo {
    width: 60px; height: 60px;
    display: flex; align-items: center; justify-content: center;
    background: rgb(var(--mdui-color-primary));
    color: rgb(var(--mdui-color-on-primary));
    border-radius: var(--mdui-shape-corner-full);
    flex-shrink: 0;
    box-shadow: var(--mdui-elevation-level2);
  }
  .hero .logo mdui-icon { font-size: 30px; }
  .hero h1 {
    margin: 0;
    font-size: 1.625rem;
    font-weight: 600;
    letter-spacing: 0;
    color: rgb(var(--mdui-color-on-primary-container));
  }
  .hero .subtitle {
    margin-top: 2px;
    font-size: 0.8125rem;
    color: rgb(var(--mdui-color-on-secondary-container));
    opacity: 0.85;
  }

  /* ---------- 分组卡片：mdui-card variant=filled ---------- */
  mdui-card.group-card {
    display: block;
    width: 100%;
    margin-bottom: 18px;
    padding: 24px 28px;
    box-sizing: border-box;
  }
  .section-head {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 20px;
  }
  .section-head .badge {
    width: 36px; height: 36px;
    display: flex; align-items: center; justify-content: center;
    background: rgb(var(--mdui-color-primary-container));
    color: rgb(var(--mdui-color-on-primary-container));
    border-radius: var(--mdui-shape-corner-full);
    flex-shrink: 0;
  }
  .section-head .badge mdui-icon { font-size: 20px; }
  .section-head .title {
    font-size: 1.0625rem;
    font-weight: 500;
    letter-spacing: 0.015625rem;
    color: rgb(var(--mdui-color-on-surface));
  }

  /* 输入行布局 */
  .fields-row {
    display: flex;
    gap: 14px;
    flex-wrap: wrap;
  }
  .fields-row mdui-text-field { flex: 1; min-width: 130px; }

  /* ---------- 按钮行 ---------- */
  .btns {
    display: flex;
    gap: 12px;
    justify-content: center;
    flex-wrap: wrap;
    margin: 26px 0 10px;
  }
  .btns mdui-button { min-width: 108px; }

  /* ---------- 结论卡：mdui-card variant=elevated + 动态容器色 ---------- */
  #conclusionWrap { display: none; margin-bottom: 20px; }
  #conclusionWrap.show { display: block; }
  #conclusionWrap mdui-card {
    width: 100%;
    padding: 28px 30px;
    box-sizing: border-box;
    display: block;
  }
  /* 用 CSS Part + 动态容器色实现结论卡的语义配色 */
  #conclusionWrap mdui-card::part(container) {
    border-radius: var(--mdui-shape-corner-extra-large);
  }
  #conclusionWrap[data-type="rec"] mdui-card {
    --mdui-color-primary: var(--mdui-color-primary-light);
    background: rgb(var(--mdui-color-primary-container));
  }
  #conclusionWrap[data-type="caution"] mdui-card {
    background: rgb(var(--mdui-color-tertiary-container));
  }
  #conclusionWrap[data-type="none"] mdui-card {
    background: rgb(var(--mdui-color-surface-container-high));
  }

  .conclusion-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    height: 32px;
    padding: 0 18px;
    border-radius: var(--mdui-shape-corner-full);
    font-size: 0.75rem;
    font-weight: 700;
    letter-spacing: 0.03rem;
    margin-bottom: 16px;
    width: fit-content;
    background: rgb(var(--mdui-color-surface-container-highest));
    color: rgb(var(--mdui-color-on-surface));
  }
  .conclusion-title {
    margin: 0 0 8px;
    font-size: 1.75rem;
    font-weight: 600;
    line-height: 1.25;
    color: rgb(var(--mdui-color-on-surface));
  }
  .conclusion-sub {
    margin: 0 0 18px;
    font-size: 0.875rem;
    color: rgb(var(--mdui-color-on-surface-variant));
  }
  .amount-row {
    display: flex;
    align-items: baseline;
    gap: 10px;
    padding: 18px 26px;
    margin-bottom: 10px;
    background: rgb(var(--mdui-color-surface-container-highest));
    border-radius: var(--mdui-shape-corner-medium);
    width: fit-content;
  }
  .amount-big {
    font-size: 2.25rem;
    font-weight: 700;
    line-height: 1;
    color: rgb(var(--mdui-color-on-surface));
    font-variant-numeric: tabular-nums;
  }
  .amount-unit { font-size: 1rem; color: rgb(var(--mdui-color-on-surface-variant)); }
  .amount-tip {
    margin: 0;
    font-size: 0.75rem;
    color: rgb(var(--mdui-color-on-surface-variant));
  }

  /* ---------- 关键指标：M3 统计小卡 ---------- */
  #metricsWrap { display: none; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; }
  #metricsWrap.show { display: flex; }
  .metric-card {
    flex: 1;
    min-width: 125px;
    padding: 16px 12px;
    text-align: center;
    background: rgb(var(--mdui-color-surface-container-low));
    border-radius: var(--mdui-shape-corner-medium);
    box-shadow: var(--mdui-elevation-level1);
  }
  .metric-label {
    display: block;
    margin-bottom: 6px;
    font-size: 0.6875rem;
    font-weight: 500;
    letter-spacing: 0.03rem;
    color: rgb(var(--mdui-color-on-surface-variant));
  }
  .metric-value {
    display: block;
    font-size: 1.0625rem;
    font-weight: 600;
    color: rgb(var(--mdui-color-on-surface));
    font-variant-numeric: tabular-nums;
  }
  .metric-value.pos { color: rgb(var(--mdui-color-primary)); }
  .metric-value.neg { color: rgb(var(--mdui-color-error)); }
  .metric-value.zero { color: rgb(var(--mdui-color-on-surface-variant)); }

  /* ---------- 详情折叠：mdui-collapse + mdui-list-item header ---------- */
  .detail-panel {
    background: rgb(var(--mdui-color-surface-container-low));
    border-radius: var(--mdui-shape-corner-medium);
    overflow: hidden;
    box-shadow: var(--mdui-elevation-level1);
    margin-bottom: 20px;
  }
  .detail-panel mdui-list-item[slot="header"] {
    --mdui-shape-corner: var(--mdui-shape-corner-medium);
    font-size: 0.875rem;
    font-weight: 500;
  }
  .detail-inner {
    padding: 4px 26px 22px;
    font-size: 0.8125rem;
    line-height: 2;
    color: rgb(var(--mdui-color-on-surface-variant));
    white-space: pre-wrap;
    word-wrap: break-word;
    font-variant-numeric: tabular-nums;
  }

  footer {
    text-align: center;
    margin-top: 28px;
    padding-top: 16px;
    font-size: 0.75rem;
    color: rgb(var(--mdui-color-on-surface-variant));
  }

  @media (max-width: 600px) {
    .container { padding: 16px 12px 44px; }
    .hero { padding: 22px 24px; gap: 14px; }
    .hero .logo { width: 50px; height: 50px; }
    .hero h1 { font-size: 1.25rem; }
    mdui-card.group-card { padding: 20px 22px; }
    #conclusionWrap mdui-card { padding: 24px 22px; }
    .conclusion-title { font-size: 1.375rem; }
    .amount-big { font-size: 1.75rem; }
    .metric-card { min-width: 105px; padding: 13px 10px; }
    .metric-value { font-size: 0.9375rem; }
  }
</style>
</head>
<body>
<div class="container">

  <!-- Hero -->
  <div class="hero">
    <div class="logo"><mdui-icon name="insights--rounded"></mdui-icon></div>
    <div>
      <h1>价值收益率计算器</h1>
      <div class="subtitle">输入数值自动识别赔率 / 奖励率，给出参考结论</div>
    </div>
  </div>

  <!-- 网站输入 -->
  <mdui-card class="group-card" variant="filled">
    <div class="section-head">
      <span class="badge"><mdui-icon name="public--rounded"></mdui-icon></span>
      <span class="title">网站数值</span>
    </div>
    <div class="fields-row">
      <mdui-text-field id="main_home" variant="filled" label="主队" type="number" step="0.01" min="0"></mdui-text-field>
      <mdui-text-field id="main_away" variant="filled" label="客队" type="number" step="0.01" min="0"></mdui-text-field>
    </div>
  </mdui-card>

  <!-- 对比平台输入 -->
  <mdui-card class="group-card" variant="filled">
    <div class="section-head">
      <span class="badge"><mdui-icon name="compare_arrows--rounded"></mdui-icon></span>
      <span class="title">对比平台数值</span>
    </div>
    <div class="fields-row">
      <mdui-text-field id="game_home" variant="filled" label="主队" type="number" step="0.01" min="0"></mdui-text-field>
      <mdui-text-field id="game_away" variant="filled" label="客队" type="number" step="0.01" min="0"></mdui-text-field>
    </div>
  </mdui-card>

  <!-- 操作按钮 -->
  <div class="btns">
    <mdui-button id="btnAnalyze" variant="filled" icon="play_arrow--rounded">开始分析</mdui-button>
    <mdui-button id="btnClear" variant="outlined" icon="restart_alt--rounded">清空</mdui-button>
    <mdui-button id="btnExample" variant="tonal" icon="science--rounded">示例</mdui-button>
  </div>

  <!-- 结论 -->
  <div id="conclusionWrap" data-type="none">
    <mdui-card variant="elevated">
      <div class="conclusion-badge" id="conclusionBadge"></div>
      <h2 class="conclusion-title" id="conclusionTitle">—</h2>
      <p class="conclusion-sub" id="conclusionSub">—</p>
      <div class="amount-row">
        <span class="amount-big" id="conclusionAmount">—</span>
        <span class="amount-unit" id="conclusionAmountUnit">元</span>
      </div>
      <p class="amount-tip" id="conclusionTip"></p>
    </mdui-card>
  </div>

  <!-- 关键指标 -->
  <div id="metricsWrap">
    <div class="metric-card">
      <span class="metric-label">网站胜率 主/客</span>
      <span class="metric-value" id="mProb">—</span>
    </div>
    <div class="metric-card">
      <span class="metric-label">公平赔率 主/客</span>
      <span class="metric-value" id="mFair">—</span>
    </div>
    <div class="metric-card">
      <span class="metric-label">实际赔率 主/客</span>
      <span class="metric-value" id="mOdds">—</span>
    </div>
    <div class="metric-card">
      <span class="metric-label">价值 主/客</span>
      <span class="metric-value" id="mValue">—</span>
    </div>
    <div class="metric-card">
      <span class="metric-label">期望 主/客</span>
      <span class="metric-value" id="mExpected">—</span>
    </div>
  </div>

  <!-- 详情折叠 -->
  <div class="detail-panel">
    <mdui-collapse>
      <mdui-collapse-item>
        <mdui-list-item slot="header" icon="calculate--rounded" end-icon="keyboard_arrow_down--rounded">
          查看详细计算过程
        </mdui-list-item>
        <div class="detail-inner" id="detailContent">填写 4 个数值后点击【开始分析】。
推荐下注金额为 100 的整数，范围 100-2000 元。</div>
      </mdui-collapse-item>
    </mdui-collapse>
  </div>

  <footer>价值收益率计算器 · Value Rate Calculator</footer>
</div>

<script>
// Pixel MD：以 Google 蓝 #1a73e8 生成完整 M3 动态配色
mdui.setColorScheme('#1a73e8');

(function () {
  const $ = (id) => document.getElementById(id);

  // 按“整组”判断：两个都 >1 视为赔率，两个都 ≤1 视为奖励率
  // 混合输入时退回单值判断（并在详情中提示）
  function isOddsPair(a, b) { return a > 1 && b > 1; }
  function isRewardPair(a, b) { return a <= 1 && b <= 1; }

  function websiteProbs(a, b) {
    if (isOddsPair(a, b)) return [1 / a, 1 / b];
    if (isRewardPair(a, b)) return [a, b];
    return [a > 1 ? 1 / a : a, b > 1 ? 1 / b : b];
  }
  function gameOdds(a, b) {
    if (isOddsPair(a, b)) return [a, b];
    if (isRewardPair(a, b)) return [a + 1, b + 1];
    return [a > 1 ? a : a + 1, b > 1 ? b : b + 1];
  }
  function pairTypeLabel(a, b) {
    if (isOddsPair(a, b)) return '赔率';
    if (isRewardPair(a, b)) return '奖励率';
    return '混合(按单值判断)';
  }
  function fmtPct(x) { return (x * 100).toFixed(1) + '%'; }
  // 避免出现 -0.0%
  function nz(x) { return Math.abs(x) < 0.05 ? 0 : x; }

  function analyze() {
    try {
      const mainHome = parseFloat($('main_home').value);
      const mainAway = parseFloat($('main_away').value);
      const gameHome = parseFloat($('game_home').value);
      const gameAway = parseFloat($('game_away').value);

      if (isNaN(mainHome) || isNaN(mainAway) || isNaN(gameHome) || isNaN(gameAway)) {
        mdui.alert('请输入有效的数字！', '输入错误');
        return;
      }
      if (mainHome <= 0 || mainAway <= 0 || gameHome <= 0 || gameAway <= 0) {
        mdui.alert('数值必须大于0！', '输入错误');
        return;
      }

      const websiteType = pairTypeLabel(mainHome, mainAway);
      const gameType = pairTypeLabel(gameHome, gameAway);

      const [homeProb, awayProb] = websiteProbs(mainHome, mainAway);
      const totalImplied = homeProb + awayProb;

      let homeProbAdj = homeProb, awayProbAdj = awayProb;
      if (totalImplied > 1.0) {
        homeProbAdj = homeProb / totalImplied;
        awayProbAdj = awayProb / totalImplied;
      }

      const [homeOdds, awayOdds] = gameOdds(gameHome, gameAway);

      const fairHomeOdds = 1 / homeProbAdj;
      const fairAwayOdds = 1 / awayProbAdj;

      const homeValue = nz((homeOdds / fairHomeOdds - 1) * 100);
      const awayValue = nz((awayOdds / fairAwayOdds - 1) * 100);

      function calcExp(prob, odds) { return prob * odds - 1; }
      const homeExpected = nz(calcExp(homeProbAdj, homeOdds) * 100);
      const awayExpected = nz(calcExp(awayProbAdj, awayOdds) * 100);

      // 下注范围：100 - 2000 元（1-20 * 100）
      const BET_MIN = 100;
      const BET_MAX = 2000;

      function buildRec(team, value, expected) {
        if (value > 0 && expected > 0) {
          return { type: 'rec', team, value, expected,
            text: `强烈推荐买入${team}`, amount: BET_MAX };
        }
        if (value > 0) {
          return { type: 'caution', team, value, expected,
            text: `谨慎买入${team}`, amount: BET_MIN };
        }
        if (expected > 0) {
          return { type: 'caution', team, value, expected,
            text: `谨慎买入${team}`, amount: BET_MIN };
        }
        return { type: 'none', team, value, expected, text: `不建议买入${team}`, amount: 0 };
      }
      const recHome = buildRec('主队', homeValue, homeExpected);
      const recAway = buildRec('客队', awayValue, awayExpected);

      const order = { rec: 2, caution: 1, none: 0 };
      const recs = [recHome, recAway].sort((a, b) => order[b.type] - order[a.type]);

      const wrap = $('conclusionWrap');
      const best = recs[0];
      const noneBoth = recHome.type === 'none' && recAway.type === 'none';

      wrap.classList.add('show');
      wrap.dataset.type = noneBoth ? 'none' : best.type;
      wrap.style.animation = 'none';
      void wrap.offsetWidth;
      wrap.style.animation = 'm3-rise 0.35s cubic-bezier(0.05, 0.7, 0.1, 1)';

      $('conclusionBadge').textContent = noneBoth ? '不推荐' : best.type === 'rec' ? '强烈推荐' : '谨慎推荐';
      $('conclusionTitle').textContent = noneBoth ? '本场不建议下注' : `建议买入${best.team}`;
      $('conclusionSub').textContent = noneBoth
        ? '主客队均无正价值且无正期望'
        : `价值 ${best.value.toFixed(1)}% ／ 期望 ${best.expected.toFixed(1)}%`;

      // 推荐下注金额（范围 100-2000 元）
      if (best.amount > 0) {
        $('conclusionAmount').textContent = best.amount.toFixed(0);
        $('conclusionAmountUnit').textContent = ' 元';
        $('conclusionTip').textContent = `推荐下注 ${best.amount.toFixed(0)} 元（范围 100-2000 元）`;
      } else {
        $('conclusionAmount').textContent = '0';
        $('conclusionAmountUnit').textContent = ' 元';
        $('conclusionTip').textContent = '不推荐下注';
      }

      // 指标卡
      $('metricsWrap').classList.add('show');
      $('mProb').textContent = fmtPct(homeProbAdj) + ' / ' + fmtPct(awayProbAdj);
      $('mProb').className = 'metric-value zero';
      $('mFair').textContent = fairHomeOdds.toFixed(2) + ' / ' + fairAwayOdds.toFixed(2);
      $('mOdds').textContent = homeOdds.toFixed(2) + ' / ' + awayOdds.toFixed(2);
      $('mValue').className = 'metric-value ' + (homeValue > 0 || awayValue > 0 ? 'pos' : 'neg');
      $('mValue').textContent = homeValue.toFixed(1) + '% / ' + awayValue.toFixed(1) + '%';
      $('mExpected').className = 'metric-value ' + (homeExpected > 0 || awayExpected > 0 ? 'pos' : 'neg');
      $('mExpected').textContent = homeExpected.toFixed(1) + '% / ' + awayExpected.toFixed(1) + '%';

      // 详细过程
      const detail = [];
      detail.push(`识别：网站=${websiteType}，对比平台=${gameType}`);
      detail.push(`胜率：主 ${fmtPct(homeProbAdj)} / 客 ${fmtPct(awayProbAdj)}`);
      detail.push(`公平赔率：主 ${fairHomeOdds.toFixed(2)} / 客 ${fairAwayOdds.toFixed(2)}`);
      detail.push(`实际赔率：主 ${homeOdds.toFixed(2)} / 客 ${awayOdds.toFixed(2)}`);
      detail.push(`价值：主 ${homeValue.toFixed(1)}% / 客 ${awayValue.toFixed(1)}%`);
      detail.push(`期望：主 ${homeExpected.toFixed(1)}% / 客 ${awayExpected.toFixed(1)}%`);
      detail.push(`推荐：${noneBoth ? '本场不建议下注' : best.text + (best.amount > 0 ? '，下注 ' + best.amount + ' 元' : '')}`);

      $('detailContent').textContent = detail.join('\n');

    } catch (e) {
      mdui.alert('计算出错：' + e.message, '错误');
    }
  }

  function clearAll() {
    ['main_home', 'main_away', 'game_home', 'game_away'].forEach(id => { $(id).value = ''; });
    $('conclusionWrap').classList.remove('show');
    $('metricsWrap').classList.remove('show');
    $('detailContent').textContent = '填写 4 个数值后点击【开始分析】。\n推荐下注金额为 100 的整数，范围 100-2000 元。';
  }

  function fillExample() {
    $('main_home').value = '1.8';
    $('main_away').value = '2.4';
    $('game_home').value = '2.0';
    $('game_away').value = '2.2';
  }

  $('btnAnalyze').addEventListener('click', analyze);
  $('btnClear').addEventListener('click', clearAll);
  $('btnExample').addEventListener('click', fillExample);

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
      e.preventDefault();
      analyze();
    }
  });

  // 结论卡入场动画
  const style = document.createElement('style');
  style.textContent = `
    @keyframes m3-rise {
      from { opacity: 0; transform: translateY(16px) scale(0.98); }
      to   { opacity: 1; transform: none; }
    }
  `;
  document.head.appendChild(style);
})();
</script>
